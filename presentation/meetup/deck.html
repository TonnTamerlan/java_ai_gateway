<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single Responsibility Principle in AI — one door to the LLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b1020; --panel: #121a2c; --panel2: #18223a; --line: #26314a; --text: #e6ebf5; --muted: #8b97b0;
    --req: #4ea1ff; --sse: #3ddc84; --file: #ff9f43; --log: #9aa4b2; --trace: #c084fc; --bad: #ff5d73; --warn: #ffd166; --gw: #c084fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080f; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ---------- 16:9 stage, scaled to fit any viewport ---------- */
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; background: var(--bg);
    transform-origin: center center; overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 40px 64px 0; display: none; }
  .slide.on { display: block; }
  .sec { display: inline-block; font-size: 15px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 700;
    color: var(--muted); padding: 5px 12px; border: 1px solid var(--line); border-radius: 99px; }
  .sec i { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  h1 { font-size: 50px; margin: 14px 0 0; font-weight: 750; letter-spacing: -.5px; }
  h1 .accent, .accent { color: var(--gw); }
  .muted { color: var(--muted); }
  .body { position: absolute; left: 64px; right: 64px; top: 165px; bottom: 60px; font-size: 27px; line-height: 1.45; }

  /* scenes */
  svg.scene { position: absolute; left: 0; top: 140px; width: 1600px; height: 640px; }
  svg.scene.tall { height: 720px; }
  .cap { position: absolute; left: 64px; right: 64px; top: 790px; height: 62px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 0 22px; display: flex; align-items: center;
    font-size: 23px; color: #d5ddee; }
  .cap:empty { opacity: 0; }
  .cap b { color: #fff; }
  .cap code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; color: #ffd8a8; }

  /* builds */
  .b { opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .35s; }
  .b.on { opacity: 1; transform: none; }

  /* progress */
  #prog { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 6px;
    padding: 0 20px; background: #080c18; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); z-index: 5; }
  #prog .ch { padding: 3px 10px; border-radius: 99px; }
  #prog .ch.on { color: #fff; background: #22304d; }
  #prog .num { margin-left: auto; font-variant-numeric: tabular-nums; }
  #prog .bar { position: absolute; left: 0; top: -2px; height: 2px; background: var(--gw); transition: width .3s; }

  /* controls — outside the stage, auto-hide */
  #ctl { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; background: rgba(18,26,44,.92);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; z-index: 10; transition: opacity .4s; font-size: 13px; }
  #ctl.hide { opacity: 0; pointer-events: none; }
  #ctl button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    cursor: pointer; font-size: 13px; min-width: 34px; }
  #ctl button:hover { border-color: #3c4d73; }
  #ctl input[type=range] { width: 120px; accent-color: var(--gw); }
  #speedV { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ---------- SVG ---------- */
  .edge { fill: none; stroke: #2a3651; stroke-width: 2.4; }
  .edge.disc { stroke: #3a4560; stroke-dasharray: 4 7; stroke-width: 2; }
  .edge.obs { stroke: #333d55; stroke-dasharray: 2 6; stroke-width: 2; }
  .edge.dep { stroke: #4b5675; stroke-width: 1.6; }
  .edge.spag { stroke: #5b4a6e; stroke-width: 2; opacity: .85; }
  .edge.fan { stroke: #4a3d63; stroke-width: 2; }
  .edge.cyc { stroke: #34405c; stroke-width: 3; }
  .edge.dimE { opacity: .25; }
  .edge.on { stroke-width: 3.6; stroke-dasharray: 10 8; animation: flow .55s linear infinite; opacity: 1; }
  .edge.on.rev { animation-direction: reverse; }
  body.paused .edge.on, body.paused .node.wobble .inner { animation-play-state: paused; }
  @keyframes flow { to { stroke-dashoffset: -18; } }

  .inner { transform-box: fill-box; transform-origin: center; }
  .box { fill: #131b2d; stroke: #34405c; stroke-width: 1.6; }
  .box.tile { fill: #141c30; }
  .rim { fill: none; stroke: #34405c; stroke-width: 1.6; }
  .node.hit .box { animation: hit .8s ease-out; }
  @keyframes hit { 0% { stroke: var(--a); filter: drop-shadow(0 0 0 var(--a)); }
                   25% { stroke: var(--a); filter: drop-shadow(0 0 18px var(--a)); }
                   100% { filter: drop-shadow(0 0 0 transparent); } }
  .node.busy .box { stroke: var(--a); filter: drop-shadow(0 0 12px var(--a)); }
  .node.hot .box { stroke: var(--bad); fill: #2a1420; }
  .node.dim { opacity: .3; }
  .node.wobble .inner { animation: wob .35s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  .t-title { font-size: 22px; font-weight: 700; fill: var(--text); }
  .t-tile { font-size: 17px; font-weight: 600; fill: #cfd7e8; }
  .t-sub { font-size: 15px; fill: var(--muted); font-style: italic; }
  .t-state { font-size: 16px; font-weight: 600; fill: var(--warn); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .t-lane { font-size: 15px; fill: #c9d1e3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pl { font-size: 14px; font-weight: 600; fill: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .mark { opacity: 0; transition: opacity .3s; }
  .mark.show { opacity: 1; }

  .badge { opacity: 0; transition: opacity .35s; }
  .badge.show { opacity: 1; }
  .badge rect { fill: #1d2740; stroke: var(--bc, #ffd166); stroke-width: 1.5; }
  .badge text { font-size: 19px; fill: var(--bc, #ffd166); font-weight: 600; }
  .badge.big rect { fill: #0e1426; stroke-width: 2.5; }
  .badge.big text { font-size: 30px; font-weight: 750; }
  .badge.chip rect { fill: #141c30; }
  .badge.chip text { font-size: 19px; fill: #e6ebf5; font-weight: 500; }
  .badge.pulse.show { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .55; } }

  /* mock UIs inside foreignObject */
  .mock { width: 100%; height: 100%; background: #f5f7fb; border-radius: 16px; overflow: hidden; color: #1f2937;
    font-size: 17px; display: flex; flex-direction: column; box-shadow: 0 0 0 2px #34405c; }
  .node.hit .mock { animation: hitHtml .8s ease-out; }
  @keyframes hitHtml { 25% { box-shadow: 0 0 0 3px var(--a), 0 0 24px var(--a); } }
  .mhead { padding: 12px 16px; font-weight: 700; background: #fff; border-bottom: 1px solid #e5e7eb; flex: none; }
  .mhead small { font-weight: 400; color: #9ca3af; font-style: italic; margin-left: 6px; }
  .msgs { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; padding: 12px; }
  .bub { max-width: 88%; padding: 9px 13px; border-radius: 14px; line-height: 1.35; }
  .bub.user { align-self: flex-end; background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
  .bub.asst { align-self: flex-start; background: #e9edf3; border-bottom-left-radius: 4px; min-height: 1.35em; }
  .cursor::after { content: '▍'; color: #1677ff; animation: blink .8s steps(2) infinite; }
  .inp { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; }
  .inp .field { flex: 1; border: 1px solid #d9d9d9; border-radius: 8px; padding: 7px 10px; min-height: 38px; }
  .ph { color: #bfbfbf; }
  .btn { background: #1677ff; color: #fff; border-radius: 8px; padding: 7px 14px; font-weight: 600; transition: transform .15s; }
  .btn.press { transform: scale(.9); background: #0958d9; }
  .drop { margin: 12px; border: 2px dashed #d9d9d9; border-radius: 10px; padding: 12px; color: #9ca3af; min-height: 98px; font-size: 16px; }
  .drop.full { border-color: #1677ff; color: #1f2937; background: #f0f7ff; }
  .btnrow { padding: 0 12px; display: flex; justify-content: flex-end; }
  .rows { padding: 8px 12px; flex: 1; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 2px 3px; border-top: 1px solid #edf0f4; }
  .row .nm { flex: 1; font-weight: 600; }
  .sum { font-size: 14px; color: #4b5563; padding: 0 2px 6px; min-height: 6px; }
  .tag { font-size: 13px; padding: 1px 8px; border-radius: 5px; border: 1px solid; }
  .tag.p { color: #d46b08; background: #fff7e6; border-color: #ffd591; }
  .tag.d { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
  .pollline { padding: 8px 14px 12px; font-size: 14px; color: #6b7280; min-height: 34px; font-family: ui-monospace, Menlo, monospace; }

  /* ---------- static slide components ---------- */
  .title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; }
  .title-wrap .goose { font-size: 110px; line-height: 1; }
  .qr-row { display: flex; gap: 90px; justify-content: center; margin-top: 34px; }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .qr-img { background: #fff; padding: 14px; border-radius: 16px; line-height: 0; }
  .qr-label { font-size: 28px; font-weight: 600; color: var(--text); }
  .qr-url { font-size: 18px; color: var(--muted); }
  .title-wrap .mega { font-size: 84px; line-height: 1.05; margin: 18px 0 8px; letter-spacing: -1.5px; }
  .title-wrap .subtitle { font-size: 44px; color: var(--sse); font-weight: 650; }
  .title-wrap .lede { font-size: 28px; color: #c4cde0; margin: 34px 0 0; line-height: 1.5; }
  .title-wrap .speaker { font-size: 24px; margin-top: 56px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; }
  .card h3 { margin: 0 0 8px; font-size: 27px; }
  .card p { margin: 0; font-size: 21px; color: #c4cde0; line-height: 1.45; }
  .card .ic { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  .card.pro { border-color: #1f5a3b; } .card.pro h3 { color: var(--sse); }
  .card.con { border-color: #5a2531; } .card.con h3 { color: var(--bad); }
  ul.clean { list-style: none; padding: 0; margin: 0; }
  ul.clean li { padding: 9px 0; font-size: 23px; border-bottom: 1px solid #1b2440; }
  ul.clean li:last-child { border-bottom: 0; }
  .quote { font-size: 34px; line-height: 1.35; font-weight: 600; border-left: 5px solid var(--gw); padding: 6px 0 6px 26px; }
  .quote cite { display: block; font-size: 20px; color: var(--muted); font-weight: 400; margin-top: 10px; font-style: normal; }
  .poll { font-size: 32px; margin-bottom: 26px; }
  .joke { position: absolute; left: 64px; right: 64px; bottom: 54px; text-align: center; font-size: 26px; color: var(--warn); font-style: italic; }
  .banner { font-size: 30px; text-align: center; padding: 16px; border: 2px dashed var(--gw); border-radius: 16px; margin-bottom: 30px; }
  .take { display: flex; gap: 26px; align-items: flex-start; margin-bottom: 30px; }
  .take .n { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #22304d; font-size: 30px; font-weight: 800; color: var(--gw); }
  .take h3 { margin: 4px 0 4px; font-size: 32px; }
  .take p { margin: 0; color: #c4cde0; font-size: 23px; }
  .lesson { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; }
  .lesson .q { font-size: 25px; font-weight: 700; color: #fff; line-height: 1.3; }
  .lesson .q::before { content: '“'; color: var(--gw); } .lesson .q::after { content: '”'; color: var(--gw); }
  .lesson p { font-size: 20px; color: #c4cde0; margin: 14px 0 0; line-height: 1.45; }
  .stats { display: flex; gap: 22px; justify-content: center; margin-top: 26px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 24px; text-align: center; }
  .stat b { display: block; font-size: 38px; color: var(--gw); }
  .stat span { font-size: 17px; color: var(--muted); }

  .about { position: absolute; inset: 0; display: flex; align-items: center; gap: 90px; padding: 0 140px; }
  .about .me { width: 440px; height: 440px; border-radius: 50%; object-fit: cover; flex: none;
    box-shadow: 0 0 0 6px #121a2c, 0 0 0 8px #3d7ade, 0 30px 80px rgba(0,0,0,.5); }
  .about .name { font-size: 78px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }
  .about .role { font-size: 38px; color: #c4cde0; margin: 18px 0 54px; }
  .about .role b { color: #4ccc93; font-weight: 700; }
  .about .logo { display: block; }

  /* ---------- presenter view ---------- */
  #pres { display: none; padding: 22px 28px; height: 100%; overflow: auto; font-size: 20px; }
  body.presenter #pres { display: block; }
  body.presenter #stage, body.presenter #ctl { display: none; }
  #pres .bar > * { white-space: nowrap; }
  #pres .bar { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  #pres .bar b { color: #fff; font-size: 30px; }
  #pres .bar button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #pres h2 { margin: 18px 0 6px; font-size: 32px; }
  #pres .notes li { margin: 8px 0; line-height: 1.45; }
  #pres .pj { color: var(--warn); font-style: italic; margin-top: 14px; }
  #pres .next { margin-top: 22px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
  #pres .late { color: var(--bad); } #pres .early { color: var(--sse); }
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="prog"><div class="bar" id="pbar"></div><div id="chips" style="display:flex;gap:6px"></div><span class="num" id="pnum"></span></div>
</div>

<div id="ctl">
  <button id="bPrev" title="← / PageUp">◀</button>
  <button id="bNext" title="→ / Space / PageDown">▶</button>
  <button id="bPause" title="P">⏸</button>
  <button id="bRestart" title="R">↺</button>
  <button id="bSlow" title="-">−</button>
  <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" title="animation speed">
  <button id="bFast" title="+">+</button>
  <span id="speedV">1×</span>
  <button id="bPres" title="S">Notes</button>
  <button id="bFull" title="F">⛶</button>
</div>

<div id="pres">
  <div class="bar">
    <b id="pSlide">1 / 23</b><span id="pSec"></span>
    <span>⏱ <b id="pTimer">00:00</b></span><span id="pPlan"></span>
    <span id="pSpeed"></span>
    <button id="pReset">reset timer</button>
    <span style="margin-left:auto">← → navigate · P pause · −/+ speed</span>
  </div>
  <h2 id="pTitle"></h2>
  <ul class="notes" id="pNotes"></ul>
  <div class="pj" id="pJoke"></div>
  <div class="next" id="pNext"></div>
</div>

<script>
'use strict';

/* =====================================================================================
   SLIDES — pure data (also read by the outline generator). Scenes are referenced by name.
   ===================================================================================== */
/*SLIDES-START*/
const SECTIONS = {
  intro:   { name: 'Opening',              color: '#9aa4b2' },

  ai:      { name: 'Built with AI',        color: '#ffd166' },
  close:   { name: 'Wrap-up',              color: '#9aa4b2' },

    html: `

        <p class="lede">A class should have one reason to change. So should a service.<br>So should your fleet's access to LLMs.</p>
      </div>`,
    notes: [
      'Today: an architecture story about AI inside a fleet of microservices — and a 20-year-old principle that turns out to be very current.',
      'This is an architecture talk, not a framework talk. No annotations, no versions, no class names on the slides. You can relax your Java muscles.',
      'Typed Goose is the study project behind the talk — a small system we built end-to-end, mostly together with an AI pair programmer. More on that at the end.',

  {
    sec: 'intro', title: 'One reason to change', min: 1.5,
    html: `
      <div class="body grid2" style="top:200px;align-items:start">
        <div class="quote">“A module should have one, and only one, reason to change.”<cite>— Robert C. Martin, the Single Responsibility Principle</cite></div>
        <div class="card">
          <h3>Why Billing changed last quarter</h3>
          <ul class="clean">
            <li>✅ new tax rules</li>
            <li>✅ new invoice format</li>
            <li>❌ the LLM vendor renamed a model</li>
            <li>❌ someone rotated the API key</li>
          </ul>
        </div>
      </div>`,
    notes: [
      'Optional quick poll (verbal, not on the slide): "Who has an LLM API key in the config of more than one service?" Count hands. "Keep your hand up if you know exactly how many." Hands usually drop — "…that\'s what I thought." That is the talk in one gesture.',
      'SRP: one reason to change. Billing changing because tax rules changed — fine, that is its job. Billing changing because an LLM vendor renamed a model — that is a second reason to change.',
      'That second reason, multiplied by every service that talks to an LLM, is the smell we are chasing today.',
    ],
    joke: 'Uncle Bob gave us SRP in the early 2000s. Twenty years later we gave every service a second reason to change: an API key.',
  },

  {
    sec: 'gateway', title: 'One door: the AI Gateway', min: 2.5, scene: 'gateway', tall: true, once: true,
    notes: [
      'The fix is the oldest trick in the book: take the responsibility that is duplicated everywhere and give it ONE owner.',
      'An AI Gateway is a service whose single job is talking to LLMs. Everything else in the fleet goes back to its own job.',
      'Look at the chips: keys, provider abstraction, model tiers, timeouts, rate limits, cost, observability, sync and batch. Many features — but one responsibility: being a good LLM client.',
      'Callers speak business ("summarize this, fast tier"), not vendor ("model X, temperature 0.2, header Y").',
    ],
    joke: 'We didn\'t remove the complexity. We gave it a home address.',
  },
  {
    sec: 'gateway', title: 'Pros & cons — honestly', min: 2,
    html: `
      <div class="body grid2" style="top:190px">
        <div class="card pro">
          <h3>👍 Pros</h3>
          <ul class="clean">
            <li>One place for keys, quotas and spend</li>
            <li>Swap or add a provider — callers don't notice</li>
            <li>Same timeouts, retries, fallbacks for everyone</li>
            <li>One place for logs, traces, cost per team</li>
            <li>Callers speak business, not vendor</li>
          </ul>
        </div>
        <div class="card con">
          <h3>👎 Cons</h3>
          <ul class="clean">
            <li>Single point of failure → replicas, health checks</li>
            <li>One extra network hop (ms vs. the LLM's seconds)</li>
            <li>Someone owns it — welcome, "AI platform team"</li>
            <li>"God gateway" if business logic leaks in</li>
            <li>Common API can hide provider-specific features</li>
          </ul>
        </div>
      </div>
      <div class="joke">“We replaced 23 problems with one. It's a very big one — but at least it's ours.”</div>`,
    notes: [
      'Single point of failure: yes. So you run more than one instance and treat it like any other critical service.',
      'Extra hop: a few milliseconds in front of a call that takes seconds. Nobody will notice.',
      'The god-gateway risk is the SRP point again: the day someone adds "if tenant is ACME, use the special prompt" into the gateway, the violation did not disappear — it just moved house. Business prompts belong to the business service.',
    ],
    joke: 'We replaced 23 problems with one. It\'s a very big one — but at least it\'s ours.',
  },
  {

    html: `

    const b = this.B[id];
    b.t.textContent = gap(text).replace(/ /g, "\u00a0");
    const padX = b.big ? 26 : 16, hgt = b.big ? 58 : 38;
    const w = b.t.getComputedTextLength() + padX * 2;
    const x0 = b.anchor === 'middle' ? -w / 2 : 0;
    b.r.setAttribute('x', x0); b.r.setAttribute('width', w); b.r.setAttribute('height', hgt);
    b.t.setAttribute('x', x0 + padX); b.t.setAttribute('y', b.big ? 39 : 25);
  }
  show(id, on = true) { this.B[id].g.classList.toggle('show', on); }

  // ---------- node state helpers
  state(id, text, color) { const n = this.N[id]; n.st.textContent = text || ''; n.st.style.fill = color || ''; }
  busy(id, on) { this.N[id].g.classList.toggle('busy', on); }
  cls(id, c, on) { this.N[id].g.classList.toggle(c, on); }
  mark(id, on) { this.N[id].mark.classList.toggle('show', on); }
  hit(id) { const g = this.N[id] && this.N[id].g; if (!g) return; g.classList.remove('hit'); void g.getBoundingClientRect(); g.classList.add('hit'); }
  edgeOn(e, color, rev) { e.n++; e.path.classList.add('on'); e.path.classList.toggle('rev', rev); e.path.style.stroke = color; }
  edgeOff(e) { if (--e.n <= 0) { e.n = 0; e.path.classList.remove('on', 'rev'); e.path.style.stroke = ''; } }
  hideEdge(e) { e.path.style.strokeDasharray = e.len; e.path.style.strokeDashoffset = e.len; e.hidden = true; }
  showEdge(e) { e.path.style.strokeDasharray = ''; e.path.style.strokeDashoffset = ''; e.hidden = false; }

  // ---------- timeline (all times in ms relative to loop start, in simulation time)
  at(ms, fn) { this.q.push({ t: this.t0 + ms, fn, gen: this.gen }); }
  tween(ms, dur, fn) { this.tw.push({ t: this.t0 + ms, d: dur, fn, gen: this.gen }); }
  caption(ms, html) { this.at(ms, () => { if (this.cap) this.cap.innerHTML = '<span>' + gap(html) + '</span>'; }); }
  draw(e, ms, dur) {
    this.tween(ms, dur, k => {
      if (k >= 1) this.showEdge(e);
      else { e.path.style.strokeDasharray = e.len; e.path.style.strokeDashoffset = e.len * (1 - k); }
    });
  }
  pop(id, ms, dur = 450) {
    const inner = this.N[id].inner;
    this.tween(ms, dur, k => {
      const s = .6 + .4 * ease(k);
      inner.style.opacity = k; inner.style.transform = k >= 1 ? '' : `scale(${s})`;
    });
  }
  look(a, b) {
    let e = this.E[a + '>' + b];
    if (e) return [e, false];
    e = this.E[b + '>' + a];
    if (e) return [e, true];
    throw new Error('no edge ' + a + ' → ' + b);
  }
  segDur(e, pace) { return Math.max(420, e.len / 0.42) * (pace || 1); }
  routeDur(route, pace) { let d = 0; for (let i = 0; i < route.length - 1; i++) d += this.segDur(this.look(route[i], route[i + 1])[0], pace); return d; }
  /** Schedules a packet; returns its arrival time (ms relative to loop start). */
  send(route, o = {}) {
    const at = o.at || 0;
    const segs = []; let s = 0;
    for (let i = 0; i < route.length - 1; i++) {
      const [e, rev] = this.look(route[i], route[i + 1]);
      const d = this.segDur(e, o.pace);
      segs.push({ e, rev, s, d }); s += d;
    }
    this.at(at, () => this.spawn({ ...o, route, segs, total: s, start: this.t0 + at }));
    return at + s;
  }
  spawn(p) {
    p.cur = -1;
    p.g = el('g', {}, this.gP);
    if (p.icon) {
      el('text', { 'font-size': 30, 'text-anchor': 'middle', y: 10 }, p.g).textContent = p.icon;
    } else {
      el('circle', { r: p.small ? 7 : 13, fill: p.color || C.req, opacity: .22 }, p.g);
      el('circle', { r: p.small ? 4 : 7, fill: p.color || C.req, stroke: '#0b1020', 'stroke-width': 1.5 }, p.g);
    }
    if (p.label) {
      p.lg = el('g', {}, p.g);
      p.lr = el('rect', { rx: 6, height: 24, y: -44, fill: '#0b1020', stroke: p.color || C.req, 'stroke-width': 1.3 }, p.lg);
      p.lt = el('text', { class: 'pl', y: -27, 'text-anchor': 'middle' }, p.lg);
    }
    this.pk.add(p);
    this.tickPacket(p, SIM.now);
  }
  tickPacket(p, now) {
    const t = now - p.start;
    if (t >= p.total) {
      if (p.cur >= 0) this.edgeOff(p.segs[p.cur].e);
      this.hit(p.route[p.route.length - 1]);
      p.g.remove(); this.pk.delete(p);
      if (p.onArrive) p.onArrive();
      return;
    }
    let i = p.segs.findIndex(sg => t < sg.s + sg.d);
    if (i !== p.cur) {
      if (p.cur >= 0) { this.edgeOff(p.segs[p.cur].e); this.hit(p.route[p.cur + 1]); }
      p.cur = i;
      const sg = p.segs[i];
      if (!p.noEdge) this.edgeOn(sg.e, p.color || C.req, sg.rev); else sg.e.n++;
      if (p.label) {
        p.lt.textContent = (Array.isArray(p.label) ? p.label[Math.min(i, p.label.length - 1)] : p.label);
        const w = p.lt.getComputedTextLength() + 16;
        p.lr.setAttribute('width', w); p.lr.setAttribute('x', -w / 2);
      }
    }
    const sg = p.segs[i];
    const k = ease(Math.min(1, (t - sg.s) / sg.d));
    const pt = sg.e.path.getPointAtLength((sg.rev ? 1 - k : k) * sg.e.len);
    p.g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
  }

  // ---------- loop
  loop(script) { this.script = script; this.restart(); }
  restart() {
    this.gen++; this.q = []; this.tw = [];
    for (const p of this.pk) p.g.remove();
    this.pk.clear();
    for (const e of Object.values(this.E)) {
      e.n = 0; e.path.classList.remove('on', 'rev'); e.path.style.stroke = ''; e.path.style.opacity = '';
      if (e.o.hidden) this.hideEdge(e);
    }
    for (const n of Object.values(this.N)) {
      n.g.classList.remove('busy', 'hit', 'hot', 'wobble');
      if (n.st) { n.st.textContent = ''; n.st.style.fill = ''; }
      if (n.mark) n.mark.classList.remove('show');
      if (n.inner) { n.inner.style.opacity = n.hidden ? 0 : ''; n.inner.style.transform = ''; }
    }
    for (const b of Object.values(this.B)) b.g.classList.remove('show');
    if (this.cap) this.cap.innerHTML = '';
    this.resets.forEach(f => f());
    this.t0 = SIM.now;
    const end = this.script(this);
    if (!this.once) this.at(end + HOLD, () => this.restart());
  }
  tick(now) {
    if (this.q.length) {
      const due = this.q.filter(x => x.t <= now);
      if (due.length) {
        this.q = this.q.filter(x => x.t > now);
        due.sort((a, b) => a.t - b.t);
        const g = this.gen;
        for (const x of due) if (x.gen === g && this.gen === g) x.fn();
      }
    }
    if (this.tw.length) {
      for (const x of this.tw.slice()) {
        if (x.gen !== this.gen) continue;
        if (now >= x.t) {
          const k = Math.min(1, (now - x.t) / x.d);
          x.fn(k);
          if (k >= 1) this.tw.splice(this.tw.indexOf(x), 1);
        }
      }
      this.tw = this.tw.filter(x => x.gen === this.gen);
    }
    for (const p of Array.from(this.pk)) this.tickPacket(p, now);
  }
  destroy() { this.gen++; this.q = []; this.tw = []; this.pk.clear(); this.svg.innerHTML = ''; }
}

function frame(ts) {
  const dt = Math.min(64, ts - SIM.last);
  SIM.last = ts;
  if (!SIM.paused) SIM.now += dt * SIM.speed;
  if (scene) scene.tick(SIM.now);
  requestAnimationFrame(frame);
}

function chatMock(s, id, x, y, w, h) {

    reset() { msgs.innerHTML = ''; field.textContent = 'Ask anything…'; field.classList.add('ph'); btn.classList.remove('press'); api.a = null; },

    send(text) { btn.classList.add('press'); setTimeout(() => btn.classList.remove('press'), 180); field.textContent = 'Ask anything…'; field.classList.add('ph'); api.bubble('user', text); },

  };

}

}

function asyncBatch(s, L, t, n0 = 3) {
  const { ui, lanes } = L;

  for (let i = 0; i < 3; i++) {

    a = s.send(['mb', 'aigw'], { at: t + i * 350, label: FILES[i][0], color: C.file });
  }
  s.at(a, () => { s.busy('aigw', true); s.state('aigw', '📦 batch 3 / 5 … or wait a few min'); });

  s.caption(b, '<b>8 ·</b> One batch → the provider\'s Batch API: ~50% cheaper, minutes instead of seconds');
  s.badge('clock', 1200, 610, '', { color: C.warn });

  checks.forEach((ans, i) => {
    const q = s.send(['aigw', 'llm'], { at: c, label: 'status?', color: C.log, pace: .6 });
    c = s.send(['llm', 'aigw'], { at: q + 150, label: ans, color: i === 2 ? C.sse : C.log, pace: .6 }) + 500;
  });
  s.tween(b, c - b, k => { const sec = Math.round(252 * k); s.setBadge('clock', `🕐 ${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')} (time-lapse)`); });
  s.caption(b + 1400, '<b>9 ·</b> …then it waits, checking the batch status now and then');
  const res = s.send(['llm', 'aigw'], { at: c, label: 'results × 3', color: C.sse });
  s.at(res, () => { s.busy('llm', false); s.state('llm', ''); s.state('aigw', ''); });
  s.caption(res, '<b>10 ·</b> Results go back onto the broker — one per file');
  let back = res;
  for (let i = 0; i < 3; i++) {
    const x = s.send(['aigw', 'mb'], { at: res + 200 + i * 350, label: 'summary ' + (i + 1), color: C.sse });
    s.at(x, () => lanes.set('res', lanes.res + 1));

    s.at(x + 300, () => lanes.set('res', Math.max(0, lanes.res - 1)));
  }
  s.at(back, () => s.busy('aigw', false));
  const sv = s.send(['calc', 'db'], { at: back + 200, label: 'DONE + summaries', color: '#b18cff' });
  s.at(sv, () => s.state('db', 'job #42 · DONE ✓', C.sse));
  s.caption(back, '<b>11 ·</b> Calculation Service stores the summaries: job <b>DONE</b>');
  const p = poll(s, ui, sv + 400, 'DONE', n0);

  s.caption(p, '<b>12 ·</b> The next poll finally says <b>DONE</b> — summaries appear in the UI 🎉');
  return p + 1500;
}

  steps.forEach(([t, sub], i) => {
    const ang = (i - 4) * 2 * Math.PI / 7;
    s.node('n' + i, { x: cx + RX * Math.cos(ang), y: cy + RY * Math.sin(ang), w: 230, h: 76, title: t, sub, accent: i === 4 ? C.sse : C.warn });
  });
  for (let i = 0; i < 7; i++) s.edge('n' + i, 'n' + ((i + 1) % 7), { cls: i === 6 ? 'disc' : 'cyc' });
  s.node('note', { x: 1240, y: 170, w: 250, h: 84, title: '🎤 “save a note”', sub: 'curated, when it\'s demo-worthy', accent: C.gw });
  s.node('hook', { x: 1240, y: 470, w: 250, h: 84, title: '💾 session-end hook', sub: 'raw transcript, automatic', accent: C.gw });
  s.node('talk', { x: 1500, y: 320, w: 180, h: 84, shape: 'pill', title: '🪿 this talk', sub: 'mined from the notes', accent: C.sse });
  s.edge('n4', 'note'); s.edge('n6', 'hook', { c: [900, 620] }); s.edge('note', 'talk'); s.edge('hook', 'talk');
  s.badge('fish', 540, 300, '🐟 new session = empty head', { color: C.warn, anchor: 'middle' });
  s.loop(s => {
    const P = { color: C.warn, label: '1 session' };
    s.caption(0, '<b>1 ·</b> Every session starts by reading the next step file — the AI\'s memory lives in the repo');
    let t = s.send(['n0', 'n1', 'n2', 'n3', 'n4'], { ...P, at: 200, label: ['read', 'brainstorm', 'plan', 'implement'] });
    s.caption(1700, '<b>2 ·</b> Brainstorm with the human, write the plan, implement in small slices');
    s.at(t, () => { s.cls('n4', 'hot', true); s.state('n4', '❌ build green, feature broken', C.bad); });
    s.caption(t, '<b>3 ·</b> Verify with a <b>real request</b> — green tests are not enough');
    t = s.send(['n4', 'n3'], { at: t + 600, label: 'fix', color: C.bad });
    t = s.send(['n3', 'n4'], { at: t + 500, label: 'retry', color: C.warn });
    s.at(t, () => { s.cls('n4', 'hot', false); s.state('n4', '✅ works end-to-end', C.sse); });
    const nt = s.send(['n4', 'note', 'talk'], { at: t + 200, label: ['aha!', 'slide'], color: C.gw });
    s.caption(t + 200, '<b>4 ·</b> Something demo-worthy? Save a curated note');
    t = s.send(['n4', 'n5', 'n6'], { at: t + 400, label: ['update docs', 'stop'], color: C.warn });
    s.caption(t - 1200, '<b>5 ·</b> Update the step file and the changelog — then <b>stop</b>. Next step = next session.');
    const ht = s.send(['n6', 'hook', 'talk'], { at: t + 100, label: ['transcript', 'raw material'], color: C.gw });
    s.at(Math.max(nt, ht), () => s.state('talk', '📝 +1 story', C.sse));
    const back = s.send(['n6', 'n0'], { at: t + 900, label: 'next session', color: C.log });
    s.at(t + 900, () => s.show('fish'));
    return Math.max(back, ht) + 800;
  });
};

const PRES = new URLSearchParams(location.search).has('presenter');
const stage = $('stage');
let cur = 0, build = 0, presWin = null, timerStart = null;

function render() {
  const root = $('slides');
  SLIDES.forEach((sl, i) => {
    const sec = SECTIONS[sl.sec];
    const div = document.createElement('section');
    div.className = 'slide';
    let h = '';
    if (!sl.noTitle) h += `<div class="sec"><i style="background:${sec.color}"></i>${sec.name}</div><h1>${sl.title}</h1>`;
    if (sl.scene) h += `<svg class="scene${sl.tall ? ' tall' : ''}" viewBox="0 0 1600 ${sl.tall ? 720 : 690}" preserveAspectRatio="xMidYMid meet"></svg>` + (sl.cap ? '<div class="cap"></div>' : '');
    h += sl.html || '';
    div.innerHTML = h;
    root.appendChild(div);
    gapText(div);
    div.querySelectorAll('img[data-photo]').forEach(img => img.src = PHOTO);
    sl.el = div;
    sl.builds = Array.from(div.querySelectorAll('.b'));
  });
  const chips = $('chips');
  Object.entries(SECTIONS).forEach(([k, v]) => {
    const c = document.createElement('span'); c.className = 'ch'; c.dataset.k = k; c.textContent = v.name.replace(/^Part \d · /, '');
    chips.appendChild(c);
  });
}

function fit() {
  const k = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}

function setBuild(n) {
  const sl = SLIDES[cur];
  build = Math.max(0, Math.min(n, sl.builds.length));
  sl.builds.forEach((b, i) => b.classList.toggle('on', i < build));
}

function go(i, o = {}) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  if (scene) { scene.destroy(); scene = null; }
  SLIDES[cur].el.classList.remove('on');
  cur = i;
  const sl = SLIDES[cur];
  sl.el.classList.add('on');
  setBuild(o.allBuilds ? sl.builds.length : 0);
  if (sl.scene) {
    scene = new Scene(sl.el.querySelector('svg.scene'), sl.el.querySelector('.cap'));
    scene.once = !!sl.once;
    SCENES[sl.scene](scene);
  }
  history.replaceState(null, '', '#' + (cur + 1));
  document.querySelectorAll('#chips .ch').forEach(c => c.classList.toggle('on', c.dataset.k === sl.sec));
  $('pnum').textContent = `${cur + 1} / ${SLIDES.length}`;
  $('pbar').style.width = (100 * (cur + 1) / SLIDES.length) + '%';
  if (timerStart === null && cur > 0) timerStart = Date.now();
  sync();
}
function next() { const sl = SLIDES[cur]; if (build < sl.builds.length) { setBuild(build + 1); sync(); } else go(cur + 1); }
function prev() { if (build > 0) { setBuild(build - 1); sync(); } else go(cur - 1, { allBuilds: true }); }

function setSpeed(v) {
  SIM.speed = Math.max(.25, Math.min(3, Math.round(v * 4) / 4));
  $('speed').value = SIM.speed; $('speedV').textContent = SIM.speed + '×';
  try { localStorage.setItem('goose-deck-speed', SIM.speed); } catch (e) {}
  sync();
}
function setPaused(p) { SIM.paused = p; document.body.classList.toggle('paused', p); $('bPause').textContent = p ? '▶' : '⏸'; sync(); }
function restartScene() { if (scene) scene.restart(); }
function fullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
function openPresenter() {
  presWin = window.open(location.pathname + '?presenter', 'goose-presenter', 'width=1100,height=760');
  setTimeout(sync, 600);
}

function key(k) {
  switch (k) {
    case 'ArrowRight': case ' ': case 'PageDown': case 'Enter': case 'ArrowDown': next(); break;
    case 'ArrowLeft': case 'PageUp': case 'Backspace': case 'ArrowUp': prev(); break;
    case 'Home': go(0); break;
    case 'End': go(SLIDES.length - 1); break;
    case 'r': case 'R': restartScene(); break;
    case 'p': case 'P': setPaused(!SIM.paused); break;
    case '-': case '_': setSpeed(SIM.speed - .25); break;
    case '+': case '=': setSpeed(SIM.speed + .25); break;
    case '0': setSpeed(1); break;
    case 'f': case 'F': fullscreen(); break;
    case 's': case 'S': openPresenter(); break;
    default: return false;
  }
  return true;
}

function stateMsg() {
  return { type: 'state', cur, build, speed: SIM.speed, paused: SIM.paused, timerStart };
}
function sync() { if (presWin && !presWin.closed) presWin.postMessage(stateMsg(), '*'); }

/* ---------- presenter window ---------- */
function presRender(st) {
  const sl = SLIDES[st.cur], nx = SLIDES[st.cur + 1];
  $('pSlide').textContent = `${st.cur + 1} / ${SLIDES.length}`;
  $('pSec').textContent = SECTIONS[sl.sec].name + (sl.builds && sl.builds.length ? ` · build ${st.build}/${sl.builds.length}` : '');
  $('pTitle').textContent = sl.title + `  (${sl.min} min)`;
  $('pNotes').innerHTML = sl.notes.map(n => `<li>${n}</li>`).join('');
  $('pJoke').textContent = sl.joke ? '😄 ' + sl.joke : '';
  $('pNext').textContent = nx ? `Next: ${nx.title}` : 'Last slide';
  $('pSpeed').textContent = `anim ${st.speed}×${st.paused ? ' (paused)' : ''}`;
  const plan = SLIDES.slice(0, st.cur).reduce((a, s) => a + s.min, 0);
  window.__plan = plan;
  if (st.timerStart && !window.__tStart) window.__tStart = st.timerStart;
}
function presTick() {
  const el2 = window.__tStart ? (Date.now() - window.__tStart) / 1000 : 0;
  const mm = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  $('pTimer').textContent = mm(el2);
  const plan = (window.__plan || 0) * 60, diff = el2 - plan;
  $('pPlan').innerHTML = `plan: ${mm(plan)} · <span class="${diff > 60 ? 'late' : 'early'}">${diff >= 0 ? '+' : '−'}${mm(Math.abs(diff))}</span> · total ${SLIDES.reduce((a, s) => a + s.min, 0)} min`;
}

/* ---------- boot ---------- */
if (PRES) {
  document.body.classList.add('presenter');
  document.title = '🗒 Presenter — ' + document.title;
  presRender({ cur: 0, build: 0, speed: 1, paused: false });
  addEventListener('message', e => { if (e.data && e.data.type === 'state') presRender(e.data); });
  addEventListener('keydown', e => { if (window.opener) { window.opener.postMessage({ type: 'key', key: e.key }, '*'); e.preventDefault(); } });
  $('pReset').onclick = () => { window.__tStart = Date.now(); };
  setInterval(presTick, 500);
} else {
  render();
  fit();
  addEventListener('resize', fit);
  let saved = 1;
  try { saved = parseFloat(localStorage.getItem('goose-deck-speed')) || 1; } catch (e) {}
  setSpeed(saved);
  const start = parseInt((location.hash || '#1').slice(1), 10) - 1;
  go(isNaN(start) ? 0 : start);
  requestAnimationFrame(frame);

  addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (key(e.key)) e.preventDefault(); });
  addEventListener('message', e => { if (e.data && e.data.type === 'key') key(e.data.key); });
  $('bPrev').onclick = prev; $('bNext').onclick = next; $('bPause').onclick = () => setPaused(!SIM.paused);
  $('bRestart').onclick = restartScene; $('bSlow').onclick = () => setSpeed(SIM.speed - .25); $('bFast').onclick = () => setSpeed(SIM.speed + .25);
  $('speed').oninput = e => setSpeed(parseFloat(e.target.value));
  $('bPres').onclick = openPresenter; $('bFull').onclick = fullscreen;
  ['bPrev', 'bNext', 'bPause', 'bRestart', 'bSlow', 'bFast', 'bPres', 'bFull'].forEach(id => $(id).addEventListener('keydown', e => e.preventDefault()));

  // controls auto-hide when the mouse is idle
  let idle;
  const wake = () => { $('ctl').classList.remove('hide'); document.body.style.cursor = ''; clearTimeout(idle);
    idle = setTimeout(() => { $('ctl').classList.add('hide'); document.body.style.cursor = 'none'; }, 2500); };
  addEventListener('mousemove', wake); wake();
}
</script>
</body>
</html>
