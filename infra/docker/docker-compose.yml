name: goose

networks:
  goose:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  elasticsearch-data:

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goose
      POSTGRES_PASSWORD: goose
      POSTGRES_DB: goose
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goose"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [goose]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.16.1
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ../logstash/pipeline.conf:/usr/share/logstash/pipeline/pipeline.conf:ro
    ports:
      # macOS reserves host port 5000 for AirPlay Receiver. Map to 5044 on the host
      # (5044 is also the conventional Logstash Beats port). In-network services
      # still talk to logstash:5000, so this affects only host-side debugging.
      - "5044:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.1
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:14269/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [goose]

  # ── Discovery ─────────────────────────────────────────────────────────────
  eureka-server:
    build:
      context: ../..
      dockerfile: infra/eureka-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  # ── Application ───────────────────────────────────────────────────────────
  spring-boot-admin:
    build:
      context: ../..
      dockerfile: infra/spring-boot-admin/Dockerfile
    environment:
      SERVER_PORT: 9000
      EUREKA_HOST: eureka-server
    ports:
      - "9000:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  ai-gateway:
    build:
      context: ../..
      dockerfile: services/ai-gateway/core/Dockerfile
    environment:
      EUREKA_HOST: eureka-server
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  chat-service:
    build:
      context: ../..
      dockerfile: services/chat-service/Dockerfile
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  calculation-service:
    build:
      context: ../..
      dockerfile: services/calculation-service/Dockerfile
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [goose]

  frontend:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [goose]
