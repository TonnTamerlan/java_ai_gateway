input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Every event from the logstash-logback-encoder carries 'service' via
  # customFields. If anything ever forgets, fall back so the index name stays
  # valid (logstash field refs do not support a :-default shell-style fallback).
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
}

output {
  # Elasticsearch 8.x ships a built-in 'logs-*-*' index template that creates
  # data streams. Writing requires op_type=create. ES auto-creates a separate
  # data stream per service; the Kibana data view 'logs-*' covers them all.
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    action => "create"
    index => "logs-%{[service]}-default"
  }
}
