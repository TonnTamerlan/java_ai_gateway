spring:
  application:
    name: eureka-server
  reactor:
    context-propagation: auto

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    loggers:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: correlationId,chatId,jobId
      remote-fields: correlationId,chatId,jobId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${JAEGER_OTLP_ENDPOINT:http://jaeger:4317}
          transport: grpc
          timeout: 10s

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  include-application-name: false

info:
  app:
    name: ${spring.application.name}
    description: Eureka discovery server
