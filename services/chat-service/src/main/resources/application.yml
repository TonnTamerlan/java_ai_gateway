spring:
  application:
    name: chat-service
  codec:
    max-in-memory-size: 1MB
  reactor:
    context-propagation: auto

server:
  port: 8083

app:
  chat:
    system-prompt: "You are a helpful assistant. Be concise."
  ai-gateway:
    base-url: lb://ai-gateway

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    loggers:
      access: unrestricted
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: correlationId,chatId,jobId
      remote-fields: correlationId,chatId,jobId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${JAEGER_OTLP_ENDPOINT:http://jaeger:4317}
          transport: grpc
          timeout: 10s
  # Jaeger ingests traces only. The Micrometer OTLP meter registry would
  # otherwise default to http://localhost:4318/v1/metrics and spam a
  # ConnectionRefused stack trace every minute.
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  include-application-name: false

info:
  app:
    name: ${spring.application.name}
    description: Chat Service — chat BFF for the React frontend
