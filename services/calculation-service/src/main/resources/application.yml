spring:
  application:
    name: calculation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goose}
    username: ${DB_USER:goose}
    password: ${DB_PASSWORD:goose}
  flyway:
    enabled: true
    schemas: calc
    default-schema: calc
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 12MB
  kafka:
    consumer:
      group-id: calc-service
      auto-offset-reset: earliest

calc:
  kafka:
    listener:
      enabled: true

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Calculation Service — async heavy-work emulator
