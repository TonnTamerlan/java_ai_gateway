spring:
  application:
    name: calculation-service
  reactor:
    context-propagation: auto
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goose}
    username: ${DB_USER:goose}
    password: ${DB_PASSWORD:goose}
  flyway:
    enabled: true
    schemas: calc
    default-schema: calc
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 12MB
  kafka:
    consumer:
      group-id: calc-service
      auto-offset-reset: earliest
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

calc:
  kafka:
    listener:
      enabled: true

server:
  port: 8082
  tomcat:
    # Spring Boot 4.0.x ships Tomcat 11 with maxPartCount=10 by default
    # (security hardening). With prompt + up to MAX_FILES=10 file parts we hit
    # 11 parts, so raise the cap with headroom. See spring-projects/spring-boot#49311.
    max-part-count: 16

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    loggers:
      access: unrestricted
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: correlationId,chatId,jobId
      remote-fields: correlationId,chatId,jobId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${JAEGER_OTLP_ENDPOINT:http://jaeger:4317}
          transport: grpc
          timeout: 10s
  # Jaeger ingests traces only. The Micrometer OTLP meter registry would
  # otherwise default to http://localhost:4318/v1/metrics and spam a
  # ConnectionRefused stack trace every minute.
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  include-application-name: false

info:
  app:
    name: ${spring.application.name}
    description: Calculation Service — async heavy-work emulator
