spring:
  application:
    name: ai-gateway
  # ai-gateway/core serves chat SSE via WebFlux. Spring Data JDBC pulls Spring MVC
  # into scope and would flip Boot to the servlet stack — pin reactive explicitly.
  main:
    web-application-type: reactive
  reactor:
    context-propagation: auto
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          stream-usage: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goose}
    username: ${DB_USER:goose}
    password: ${DB_PASSWORD:goose}
  flyway:
    enabled: true
    schemas: ai
    default-schema: ai
    locations: classpath:db/migration
  # Note: `spring.kafka.bootstrap-servers` is intentionally NOT defaulted here.
  # KafkaConfig is @ConditionalOnProperty on it, so tests without a broker skip
  # the Kafka beans entirely. Docker compose sets SPRING_KAFKA_BOOTSTRAP_SERVERS,
  # which Spring maps to the property automatically.
  kafka:
    consumer:
      group-id: ai-gateway
      auto-offset-reset: earliest
      max-poll-records: 5
      # fetch-min-bytes + fetch-max-wait together approximate "5 OR ~3 min".
      # Without fetch-min-bytes > 1, the broker returns instantly on the first
      # byte and the 3-min ceiling is dead weight. 5000 bytes ≈ ~5 short
      # summarization requests; tune as a knob.
      fetch-min-bytes: 5000
      fetch-max-wait: 180000
      # KafkaConfig.java derives request.timeout.ms = fetch-max-wait + 20s so
      # the consumer's fetch doesn't abort at the 30s default before the
      # broker reaches its wait threshold.

server:
  port: 8081

app:
  ai:
    provider: openai
    models:
      fast: gpt-4o-mini
      medium: gpt-4o
      slow: gpt-4-turbo
    batch:
      poll-interval-ms: 30000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    loggers:
      access: unrestricted
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: correlationId,chatId,jobId
      remote-fields: correlationId,chatId,jobId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${JAEGER_OTLP_ENDPOINT:http://jaeger:4317}
          transport: grpc
          timeout: 10s
  # Jaeger ingests traces only. The Micrometer OTLP meter registry would
  # otherwise default to http://localhost:4318/v1/metrics and spam a
  # ConnectionRefused stack trace every minute.
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
  include-application-name: false

info:
  app:
    name: ${spring.application.name}
    description: AI Gateway entrypoint to AI providers
