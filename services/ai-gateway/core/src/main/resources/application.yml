spring:
  application:
    name: ai-gateway
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          stream-usage: true

server:
  port: 8081

app:
  ai:
    provider: openai
    models:
      fast: gpt-4o-mini
      medium: gpt-4o
      slow: gpt-4-turbo

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: AI Gateway entrypoint to AI providers
