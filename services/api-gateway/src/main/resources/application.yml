spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 120s
            connect-timeout: 5000
            compression: false   # gzip on SSE breaks token-level flushing
          discovery:
            locator:
              enabled: false
          routes:
            - id: chat
              uri: lb://chat-service
              predicates:
                - Path=/api/chats/**
              filters:
                - StripPrefix=1
            - id: jobs
              uri: lb://calculation-service
              predicates:
                - Path=/api/jobs/**
              filters:
                - StripPrefix=1
            - id: summarize
              uri: lb://calculation-service
              predicates:
                - Path=/api/summarize/**
              filters:
                - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API Gateway — Spring Cloud Gateway edge router
