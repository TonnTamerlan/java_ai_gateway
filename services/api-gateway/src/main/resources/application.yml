spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: chat
          uri: lb://chat-service
          predicates:
            - Path=/api/chats/**
          filters:
            - StripPrefix=1
        - id: jobs
          uri: lb://calculation-service
          predicates:
            - Path=/api/jobs/**
          filters:
            - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API Gateway — Spring Cloud Gateway edge router
